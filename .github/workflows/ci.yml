name: Validate

on:
  push:
    branches: [dev, qs, prd]
  pull_request:
    branches: [dev, qs, prd]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run web:export
      - run: bash -n deploy/scripts/*.sh
